[package]
name = "email"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Rust CLI for email over IMAP and SMTP"
license = "MIT"
repository = "https://github.com/batusaribay/email"
publish = false

[[bin]]
name = "email"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
imap = "2.4"
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust", "apple-native", "windows-native"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
native-tls = "0.2"
percent-encoding = "2"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sigpipe = "0.1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "time"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
